name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.2.3)
        required: true
        type: string
      dry_run:
        description: Build, sign and notarize only, keep the assets as workflow artifacts
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Resolve tag, version and mode
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            PRERELEASE="$RELEASE_PRERELEASE"
            DRY_RUN=false
          else
            TAG="$INPUT_TAG"
            DRY_RUN="$INPUT_DRY_RUN"
            # Trust the release flag when the release exists, otherwise any semver prerelease counts
            if ! PRERELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease 2>/dev/null)"; then
              case "$TAG" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
            fi
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semver version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9]+))?$ ]] \
            || [ "${BASH_REMATCH[1]}" -gt 255 ] || [ "${BASH_REMATCH[2]}" -gt 255 ] \
            || [ "${BASH_REMATCH[3]}" -gt 65535 ] || [ "${BASH_REMATCH[5]:-0}" -gt 65535 ]; then
            echo "::warning::WiX cannot encode $VERSION, the Windows MSI is skipped and only the NSIS installer ships"
          fi
          # Dry runs may test a tag that does not exist yet, they then build the dispatched commit
          REF="refs/tags/$TAG"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::Tag $TAG does not exist yet, building $GITHUB_SHA instead"
              REF="$GITHUB_SHA"
            else
              echo "::error::Tag $TAG does not exist"
              exit 1
            fi
          fi
          {
            echo "ref=$REF"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG, version $VERSION, prerelease $PRERELEASE, dry run $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal
    needs: meta
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BMM_VERSION: ${{ needs.meta.outputs.version }}
      APP: dist/macos/Balatro Mod Manager.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal

      - name: Build the universal .app
        run: BUNDLES=app scripts/build-macos.sh universal

      - name: Fetch signing toolkit
        uses: actions/checkout@v7
        with:
          repository: RanduSoft/macos-signing
          token: ${{ secrets.SIGNING_PAT }}
          path: .signing
          persist-credentials: false

      - name: Sign, notarize and staple
        uses: ./.signing
        with:
          app-path: ${{ env.APP }}
          entitlements: src-tauri/Entitlements.plist

      - name: Remove signing toolkit
        if: always()
        run: rm -rf .signing

      - name: Verify Developer ID signature and staple
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application'
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'flags=.*runtime'
          codesign -d --entitlements - "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec -vv "$APP"

      - name: Package zip and dmg
        run: |
          OUT=dist/release
          mkdir -p "$OUT"
          NAME="Balatro-Mod-Manager-$RELEASE_VERSION-macos-universal"

          ditto -c -k --keepParent "$APP" "$OUT/$NAME.zip"
          CHECK="$RUNNER_TEMP/zip-check"
          mkdir -p "$CHECK"
          ditto -x -k "$OUT/$NAME.zip" "$CHECK"
          xcrun stapler validate "$CHECK/Balatro Mod Manager.app"
          spctl --assess --type exec -vv "$CHECK/Balatro Mod Manager.app"

          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Balatro Mod Manager.app"
          ln -s /Applications "$STAGE/Applications"
          # hdiutil sometimes fails with "Resource busy" on hosted runners, retry a few times
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Balatro Mod Manager" -srcfolder "$STAGE" -fs HFS+ \
              -format UDZO -ov "$OUT/$NAME.dmg"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done
          hdiutil verify "$OUT/$NAME.dmg"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BMM_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build NSIS and MSI installers
        run: scripts/build-windows.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/windows/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      BMM_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build deb, AppImage and rpm in Docker
        run: scripts/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/linux/*
          if-no-files-found: error

  # Optional, a Flatpak failure never blocks the other assets
  flatpak:
    name: Flatpak
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      BMM_VERSION: ${{ needs.meta.outputs.version }}
      BUNDLE: Balatro-Mod-Manager-${{ needs.meta.outputs.version }}-linux.flatpak
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: Pass the app version into the Flatpak build
        run: |
          sed -i "s/\"env\": {/\"env\": {\n          \"BMM_VERSION\": \"$BMM_VERSION\",/" \
            packaging/flatpak/io.balatro.ModManager.json
          grep -n BMM_VERSION packaging/flatpak/io.balatro.ModManager.json

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.balatro.ModManager.json
          bundle: ${{ env.BUNDLE }}
          upload-artifact: false
          cache-key: flatpak-builder-${{ needs.meta.outputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [meta, macos, windows, linux, flatpak]
    if: >-
      ${{ !cancelled() && needs.meta.result == 'success' && needs.macos.result == 'success'
      && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Write checksums
        run: |
          cd assets
          if ! ls ./*.flatpak >/dev/null 2>&1; then
            echo "::warning::No Flatpak bundle, publishing without it"
          fi
          sha256sum -- * > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt
          {
            echo '```'
            cat checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The assets themselves are already attached to this run by the build jobs
      - name: Keep the dry run checksums
        if: needs.meta.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: assets/checksums.txt

      - name: Upload assets to the release
        if: needs.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: assets/*
          fail_on_unmatched_files: true

      - name: Trigger Homebrew tap update
        if: needs.meta.outputs.dry_run != 'true' && needs.meta.outputs.prerelease != 'true'
        uses: actions/github-script@v9
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        with:
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'rursache',
              repo: 'homebrew-tap',
              workflow_id: 'update-formula.yml',
              ref: 'master',
              inputs: {
                formula: 'balatro-mod-manager',
                tag: process.env.TAG,
                repository: context.repo.owner + '/' + context.repo.repo
              }
            })
